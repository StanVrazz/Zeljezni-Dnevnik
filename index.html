.kt-picker-input { font-family: var(--font-sans); padding-right: 34px; }

.kt-picker-dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 3px; max-height: 300px; overflow-y: auto; z-index: 30; }

.kt-chip { display: inline-flex; align-items: center; font-size: 11px; padding: 3px 8px; border-radius: 2px; font-weight: 500; flex-shrink: 0; }

.kt-category-toggle { display: flex; gap: 8px; margin: 10px 0; }
